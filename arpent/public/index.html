<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arpent — Prospection géolocalisée</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">A</span>
      <span class="name">Arpent</span>
    </div>
    <div class="status" id="status-bar">Prêt</div>
  </header>

  <main class="workspace">
    <aside class="panel filters">
      <div class="field">
        <label class="field-label" for="addr-input">Point de départ</label>
        <input id="addr-input" class="addr-input" type="text" placeholder="Adresse, ville..." autocomplete="off" value="Montpellier" />
        <ul id="addr-suggestions" class="suggestions" hidden></ul>
      </div>

      <div class="field">
        <div class="radius-row">
          <label class="field-label" for="radius-input" style="margin-bottom:0;">Rayon de recherche</label>
          <div class="radius-value"><span id="radius-value">25</span> km</div>
        </div>
        <input id="radius-input" type="range" min="1" max="200" value="25" />
        <div class="radius-ticks"><span>1</span><span>100</span><span>200 km</span></div>
      </div>

      <div class="field">
        <label class="field-label">Secteur d'activité</label>
        <div id="secteur-chips" class="chip-group"></div>
      </div>

      <button id="search-btn" class="btn-apply">Lancer la recherche</button>
      <p class="hint">Données publiques Sirene (api.gouv.fr) — établissements actifs uniquement.</p>
    </aside>

    <section class="panel map-panel">
      <div id="map"></div>
    </section>

    <section class="results-panel">
      <div class="results-head">
        <span class="title" id="results-title">Résultats</span>
        <button id="export-btn" class="export-btn" disabled>Exporter en CSV</button>
      </div>
      <div id="results-list" class="results"></div>
    </section>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
