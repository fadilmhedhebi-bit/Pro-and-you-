databases:
  - name: pro-and-you-db
    plan: free
    databaseName: tournee_snack

services:
  - type: web
    name: pro-and-you
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run db:init
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pro-and-you-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: arpent
    runtime: node
    plan: free
    rootDir: arpent
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_PLACES_API_KEY
        sync: false
